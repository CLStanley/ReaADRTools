name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua-and-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y lua5.4 shellcheck
      - name: Lua syntax
        run: find scripts tests -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Lua tests
        run: tests/run.sh
      - name: Shellcheck
        run: shellcheck packaging/*.sh packaging/*.command extension/*.sh tests/*.sh

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned REAPER SDK and WDL
        run: extension/fetch-dependencies.sh
      - name: Serial build
        working-directory: extension
        run: make
      - name: Parallel dist build
        working-directory: extension
        run: make clean && make -j2 dist
