name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-and-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned REAPER SDK and WDL
        run: extension/fetch-dependencies.sh
      - name: Native tests
        run: tests/run.sh
      - name: Shellcheck
        run: shellcheck packaging/*.sh packaging/*.command extension/*.sh tests/*.sh

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned REAPER SDK and WDL
        run: extension/fetch-dependencies.sh
      - name: Serial build
        working-directory: extension
        run: make
      - name: Parallel dist build
        working-directory: extension
        run: make clean && make -j2 dist
      - name: Assemble available release packages
        run: packaging/create-release-packages.sh
      - name: Verify Linux release payload
        run: packaging/validate-release-package.sh dist/installers/ReaADRTools-linux-x64 linux-x64
      - name: Verify unsupported packages were not fabricated
        run: |
          test ! -e dist/installers/ReaADRTools-windows.zip
          test ! -e dist/installers/ReaADRTools-macos.zip

  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned REAPER SDK and WDL
        run: extension/fetch-dependencies.sh
      - name: Native tests
        working-directory: extension
        run: make test LDFLAGS="-framework Cocoa"
      - name: Build native macOS extension
        working-directory: extension
        run: make clean && make LDFLAGS="-shared -framework Cocoa"

  native-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch pinned REAPER SDK and WDL
        shell: bash
        run: extension/fetch-dependencies.sh
      - name: Build native Windows extension with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call extension\build-windows-msvc.bat
      - name: Verify Windows native payload
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/UserPlugins/reaper_reaadr.dll')) { throw 'Missing Windows native extension DLL.' }
          if (-not (Test-Path 'dist/Scripts/ReaADRTools/scripts/ReaADR_Record_Cue.lua')) { throw 'Lua parity/reference scripts were not retained in the Windows payload.' }
          if (-not (Test-Path 'dist/Scripts/ReaADRTools/scripts/ReaADR_Cue_Info_Panel.lua')) { throw 'Cue Info Lua reference is missing from the Windows payload.' }
